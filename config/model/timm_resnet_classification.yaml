_target_: src.models.TimmClassification.TimmClassification
model_name: "gluon_resnet18_v1b"

optimizer:
  _target_: torch.optim.SGD
  _partial_: true
  lr: 0.0001
  weight_decay: 0.05

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: ${trainer.max_epochs}

# Warmup de LR (por épocas). 0 = desactivado
warmup_epochs: 3
warmup_start_factor: 0.1