_target_: src.models.TimmClassification.TimmClassification
model_name: "convnext_tiny"

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.001
  weight_decay: 0.0005

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: ${trainer.max_epochs}

# Warmup de LR (por épocas). 0 = desactivado
warmup_epochs: 5
warmup_start_factor: 0.01